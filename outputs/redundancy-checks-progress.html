<div id="gnosis-redundancy-preview">
  <div class="viz-dotted-background gr-stage">
    <section class="gr-dialog" aria-labelledby="gr-title">
      <div class="gr-pinned">
        <header class="gr-header">
          <button class="gr-button gr-previous" type="button" inert>
            <i data-lucide="chevron-left" aria-hidden="true">‹</i>Previous
          </button>
          <h2 id="gr-title">Redundancy checks</h2>
          <div class="gr-nav" inert>
            <button class="gr-button" type="button">Cancel</button>
            <button class="gr-button gr-next" type="button" disabled>
              Next<i data-lucide="chevron-right" aria-hidden="true">›</i>
            </button>
          </div>
        </header>
        <div class="gr-progress" data-mode="measured">
          <div class="gr-progress-line" role="status" aria-atomic="true">
            <span id="gr-phase">Comparing footnote meanings</span>
            <span class="gr-count">7 of 12 batches</span>
          </div>
          <div class="gr-track" role="progressbar" aria-labelledby="gr-phase"
               aria-valuemin="0" aria-valuemax="12" aria-valuenow="7"
               aria-valuetext="7 of 12 comparison batches complete">
            <div class="gr-fill"></div>
          </div>
        </div>
      </div>

      <div class="gr-results">
        <section aria-labelledby="gr-images">
          <h3 id="gr-images">Redundant images</h3>
          <p class="gr-support gr-image-pending" hidden>Checking for redundant images…</p>
          <article class="gr-image-group">
            <div class="gr-ornament" role="img" aria-label="Repeated chapter ornament">
              <span aria-hidden="true">❧</span>
            </div>
            <h4>Chapters that include this image</h4>
            <ul class="gr-chapters">
              <li>
                <span>1. Introduction</span>
                <label><input type="checkbox" data-choice="introduction" aria-label="Include the Introduction image in export" checked>Include in export</label>
              </li>
              <li>
                <span>4. Commentary</span>
                <label><input type="checkbox" data-choice="commentary" aria-label="Include the Commentary image in export">Include in export</label>
              </li>
            </ul>
          </article>
        </section>
        <section aria-labelledby="gr-footnotes">
          <h3 id="gr-footnotes">Redundant footnotes</h3>
          <p class="gr-support gr-note-status">Checking for redundant footnotes…</p>
          <button class="gr-button gr-retry" type="button" hidden>Retry checks</button>
        </section>
      </div>
    </section>
  </div>
  <div class="gr-preview-controls">
    <label class="form-label" for="gr-preview-state">Preview state</label>
    <select class="form-select" id="gr-preview-state">
      <option value="scanning">Scanning the book</option>
      <option value="preparing">Preparing footnotes</option>
      <option value="comparing" selected>Comparing footnotes</option>
      <option value="complete">Checks complete</option>
      <option value="interrupted">Check interrupted</option>
    </select>
  </div>
</div>

<style>
  #gnosis-redundancy-preview { container-type: inline-size; }
  #gnosis-redundancy-preview .gr-stage { padding: clamp(8px, 3%, 24px); }
  #gnosis-redundancy-preview .gr-preview-controls {
    display: grid; grid-template-columns: auto minmax(0, 190px);
    align-items: center; justify-content: center; gap: 10px; margin-top: 12px;
  }
  #gnosis-redundancy-preview .gr-dialog {
    --gr-paper: light-dark(#fffbf5, #2b241e);
    --gr-ink: light-dark(#4a2d13, #f5e5cd);
    --gr-secondary: light-dark(#805b36, #ceb59a);
    --gr-line: light-dark(#e1d3c0, #544738);
    --gr-row: light-dark(#fbf4e9, #332b23);
    --gr-track: light-dark(#ecdfcb, #504333);
    --gr-amber-start: light-dark(#c6780a, #d99a43);
    --gr-amber-end: light-dark(#ed9214, #f1b65f);
    --gr-primary-ink: light-dark(#fffcf5, #2b2012);
    --gr-error: light-dark(#98452c, #f0b19a);
    --gr-shadow: light-dark(rgba(102, 72, 34, .09), rgba(0, 0, 0, .21));
    color-scheme: inherit;
    box-sizing: border-box;
    width: 100%;
    max-width: 960px;
    margin-inline: auto;
    padding: clamp(14px, 3.5%, 28px);
    color: var(--gr-ink);
    font: 400 15px/1.45 Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--gr-paper);
    border: 1px solid var(--gr-line);
    border-radius: 12px;
    box-shadow: 0 8px 24px var(--gr-shadow);
  }
  #gnosis-redundancy-preview .gr-dialog * { box-sizing: border-box; }
  #gnosis-redundancy-preview .gr-dialog [hidden] { display: none; }
  #gnosis-redundancy-preview .gr-header,
  #gnosis-redundancy-preview .gr-nav,
  #gnosis-redundancy-preview .gr-button { display: flex; align-items: center; }
  #gnosis-redundancy-preview .gr-header { gap: 16px; }
  #gnosis-redundancy-preview h2 {
    flex: 1; margin: 0; color: var(--gr-ink);
    font: 650 23px/1.2 Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.025em;
  }
  #gnosis-redundancy-preview .gr-nav { gap: 8px; }
  #gnosis-redundancy-preview .gr-button {
    justify-content: center; gap: 6px; min-height: 40px; padding: 0 15px;
    border: 1px solid var(--gr-line); border-radius: 11px;
    color: var(--gr-ink); background: var(--gr-paper);
    box-shadow: 0 3px 8px var(--gr-shadow);
    font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.2;
    white-space: nowrap;
  }
  #gnosis-redundancy-preview .gr-button svg { width: 16px; height: 16px; }
  #gnosis-redundancy-preview .gr-button i { font: normal 20px/1 Arial, sans-serif; }
  #gnosis-redundancy-preview .gr-next {
    border-color: transparent; color: var(--gr-primary-ink);
    background: linear-gradient(180deg, var(--gr-amber-end), var(--gr-amber-start));
  }
  #gnosis-redundancy-preview .gr-next:disabled { opacity: .55; }
  #gnosis-redundancy-preview .gr-progress { margin-top: 23px; }
  #gnosis-redundancy-preview .gr-progress-line {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 3px 14px; margin-bottom: 8px;
    font-size: 14px; font-weight: 600;
  }
  #gnosis-redundancy-preview .gr-count {
    color: var(--gr-secondary); font-weight: 500; font-variant-numeric: tabular-nums;
  }
  #gnosis-redundancy-preview .gr-track {
    height: 8px; overflow: hidden; border-radius: 999px; background: var(--gr-track);
  }
  #gnosis-redundancy-preview .gr-fill {
    height: 100%; width: 58.3333%; border-radius: inherit;
    background: linear-gradient(90deg, var(--gr-amber-start), var(--gr-amber-end));
    transition: width 180ms ease;
  }
  #gnosis-redundancy-preview [data-mode="indeterminate"] .gr-fill {
    width: 32%; animation: gr-scan 1.65s ease-in-out infinite alternate;
  }
  @keyframes gr-scan { from { transform: translateX(0); } to { transform: translateX(212.5%); } }
  #gnosis-redundancy-preview [data-mode="interrupted"] .gr-fill { background: var(--gr-secondary); }
  #gnosis-redundancy-preview [data-mode="interrupted"] #gr-phase { color: var(--gr-error); }
  #gnosis-redundancy-preview .gr-results { display: grid; gap: 22px; margin-top: 26px; }
  #gnosis-redundancy-preview h3 {
    margin: 0 0 9px; color: var(--gr-ink);
    font: 650 18px/1.3 Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.015em;
  }
  #gnosis-redundancy-preview .gr-support { margin: 0; color: var(--gr-secondary); font-size: 14px; }
  #gnosis-redundancy-preview .gr-image-group {
    padding: 14px; border: 1px solid var(--gr-line); border-radius: 8px;
  }
  #gnosis-redundancy-preview .gr-ornament {
    display: flex; width: 116px; align-items: center; justify-content: center; gap: 5px;
    padding: 3px 8px; background: #f6f0e3; color: #61533a;
    font: 28px/1 Georgia, "Times New Roman", serif;
  }
  #gnosis-redundancy-preview .gr-ornament::before,
  #gnosis-redundancy-preview .gr-ornament::after {
    content: ""; flex: 1; height: 1px; background: currentColor; opacity: .62;
  }
  #gnosis-redundancy-preview h4 { margin: 10px 0 8px; font: 600 14px/1.4 Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #gnosis-redundancy-preview .gr-chapters { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  #gnosis-redundancy-preview .gr-chapters li {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 4px 14px; padding: 7px 10px; border-radius: 7px; background: var(--gr-row); font-size: 14px;
  }
  #gnosis-redundancy-preview .gr-chapters label {
    display: inline-flex; align-items: center; gap: 7px; color: var(--gr-ink); white-space: nowrap;
  }
  #gnosis-redundancy-preview .gr-chapters input {
    margin: 0; width: 15px; height: 15px; accent-color: var(--gr-amber-start);
  }
  #gnosis-redundancy-preview .gr-retry { margin-top: 10px; }
  @container (max-width: 535px) {
    #gnosis-redundancy-preview .gr-header { flex-wrap: wrap; gap: 12px; }
    #gnosis-redundancy-preview h2 { flex-basis: 100%; order: -1; }
    #gnosis-redundancy-preview .gr-nav { margin-inline-start: auto; }
    #gnosis-redundancy-preview .gr-button { min-height: 36px; padding-inline: 10px; }
  }
  @media (pointer: coarse) {
    #gnosis-redundancy-preview .gr-chapters label,
    #gnosis-redundancy-preview .gr-retry { min-height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #gnosis-redundancy-preview .gr-fill { transition: none; }
    #gnosis-redundancy-preview [data-mode="indeterminate"] .gr-fill {
      width: 100%; animation: none;
      background: repeating-linear-gradient(120deg, var(--gr-amber-start) 0 3px, transparent 3px 10px);
    }
  }
</style>

<script>
(() => {
  const root = document.getElementById('gnosis-redundancy-preview');
  const select = root.querySelector('#gr-preview-state');
  const phases = {
    scanning: { title: 'Scanning the book', mode: 'indeterminate', count: '' },
    preparing: { title: 'Computing word frequencies', mode: 'indeterminate', count: '' },
    comparing: { title: 'Comparing footnote meanings', mode: 'measured', count: '7 of 12 batches', value: 7, total: 12 },
    complete: { title: 'Checks complete', mode: 'complete', count: '2 of 2 checks', value: 2, total: 2 },
    interrupted: { title: 'Footnote check interrupted', mode: 'interrupted', count: '7 of 12 batches', value: 7, total: 12 }
  };
  const progress = root.querySelector('.gr-progress');
  const track = root.querySelector('.gr-track');
  const fill = root.querySelector('.gr-fill');
  const choices = [...root.querySelectorAll('[data-choice]')];
  const group = root.querySelector('.gr-image-group');
  const retry = root.querySelector('.gr-retry');
  const imagesPending = root.querySelector('.gr-image-pending');
  const noteStatus = root.querySelector('.gr-note-status');
  const next = root.querySelector('.gr-next');

  function render() {
    const key = select.value;
    const phase = phases[key];
    progress.dataset.mode = phase.mode;
    root.querySelector('#gr-phase').textContent = phase.title;
    root.querySelector('.gr-count').textContent = phase.count;
    if (phase.total) {
      track.setAttribute('aria-valuemax', phase.total);
      track.setAttribute('aria-valuenow', phase.value);
      track.setAttribute('aria-valuetext', phase.count + (key === 'interrupted' ? ' complete when interrupted' : ' complete'));
      fill.style.width = (100 * phase.value / phase.total) + '%';
    } else {
      track.removeAttribute('aria-valuemax');
      track.removeAttribute('aria-valuenow');
      track.removeAttribute('aria-valuetext');
      fill.style.removeProperty('width');
    }
    imagesPending.hidden = key !== 'scanning';
    group.hidden = !imagesPending.hidden;
    noteStatus.textContent = key === 'complete' ? 'No redundant footnotes found.'
      : key === 'interrupted' ? 'Could not finish checking for redundant footnotes.'
      : 'Checking for redundant footnotes…';
    next.disabled = key !== 'complete' && key !== 'interrupted';
    retry.hidden = key !== 'interrupted';
  }

  function save() {
    const included = Object.fromEntries(choices.map(input => [input.dataset.choice, input.checked]));
    window.openai?.setWidgetState?.({
      modelContent: { previewState: select.value },
      privateContent: { included }
    })?.catch(() => {});
  }

  function restore(snapshot) {
    const key = snapshot?.modelContent?.previewState;
    select.value = Object.hasOwn(phases, key) ? key : 'comparing';
    for (const input of choices) {
      const stored = snapshot?.privateContent?.included?.[input.dataset.choice];
      input.checked = typeof stored === 'boolean' ? stored : input.defaultChecked;
    }
    render();
  }

  select.addEventListener('change', () => { render(); save(); });
  choices.forEach(input => input.addEventListener('change', save));
  retry.addEventListener('click', () => {
    select.value = 'scanning';
    render();
    select.focus();
    save();
  });
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail?.globals;
    if (globals && Object.hasOwn(globals, 'widgetState')) restore(globals.widgetState);
  });
})();
</script>
