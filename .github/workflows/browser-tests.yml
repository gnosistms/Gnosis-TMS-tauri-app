name: Windows installer verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reinstall:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        previous: ["0.8.148", "0.8.153"]
    steps:
      - name: Verify Windows uninstall and reinstall with an existing project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Download-Package([string]$version) {
            $asset = "Gnosis.TMS_${version}_x64_en-US.msi"
            $url = "https://github.com/gnosistms/Gnosis-TMS-tauri-app/releases/download/v$version/$asset"
            $dest = Join-Path $env:RUNNER_TEMP $asset
            Invoke-WebRequest $url -OutFile $dest
            return $dest
          }
          function Run-Msi([string]$operation, [string]$package) {
            $proc = Start-Process msiexec.exe -ArgumentList @($operation, ('"{0}"' -f $package), '/qn', '/norestart') -Wait -PassThru
            if ($proc.ExitCode -notin @(0, 3010)) { throw "Installer failed ($operation) with $($proc.ExitCode)." }
          }
          $previous = Download-Package '${{ matrix.previous }}'
          $current = Download-Package '0.8.154'
          Run-Msi '/i' $previous
          $repo = Join-Path $env:APPDATA 'com.gnosis.tms/installations/installation-7/projects/returning-test'
          New-Item -ItemType Directory -Force $repo | Out-Null
          git -C $repo init -b main
          'Local unpublished translation' | Set-Content "$repo/translation.txt"
          git -C $repo add translation.txt
          git -C $repo -c user.name=Test -c user.email=test@example.invalid commit -m "Local work"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the previous local project' }
          'Unpublished working copy' | Add-Content "$repo/translation.txt"
          'Private draft' | Set-Content "$repo/untracked.txt"
          $headBefore = git -C $repo rev-parse HEAD
          $indexBefore = (Get-FileHash "$repo/.git/index").Hash
          $rowBefore = (Get-FileHash "$repo/translation.txt").Hash
          $draftBefore = (Get-FileHash "$repo/untracked.txt").Hash
          Run-Msi '/x' $previous
          Run-Msi '/i' $current
          $exe = Get-ChildItem -Path "$env:ProgramFiles/*Gnosis*/*.exe", "${env:ProgramFiles(x86)}/*Gnosis*/*.exe", "$env:LOCALAPPDATA/*Gnosis*/*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^gnosis[ -]?tms\.exe$' } | Select-Object -First 1
          if (-not $exe) { throw 'Could not locate the installed Gnosis TMS executable.' }
          Write-Host "Installed executable $($exe.FullName) version $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductVersion -notmatch '^0\.8\.154\b') { throw 'Incorrect installed version' }
          $app = Start-Process $exe.FullName -PassThru
          try {
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited during startup ($($app.ExitCode))." }
              if ($app.MainWindowHandle -ne 0 -and $i -ge 14) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'Installed app did not open a desktop window.' }
            if ((git -C $repo rev-parse HEAD) -ne $headBefore -or (Get-FileHash "$repo/.git/index").Hash -ne $indexBefore -or (Get-FileHash "$repo/translation.txt").Hash -ne $rowBefore -or (Get-FileHash "$repo/untracked.txt").Hash -ne $draftBefore) { throw 'Reinstall failed to preserve local project contents.' }
            Write-Host "The installed app opened after reinstall. Local commit, index, edited file and untracked file survived."
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }
