name: Windows desktop verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.99.1"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ade25401d9e297abca83cd2282549f6f967e4758
          fetch-depth: 0
      - name: Use the unmodified linker for the older compiler comparison
        if: matrix.toolchain == '1.99.1'
        run: git checkout f03a4e554a5d6a6aa260c861224428b5fee5318a -- src-tauri/build.rs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - name: Compile the release app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force src-tauri/binaries/typst-x86_64-pc-windows-msvc.exe | Out-Null
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin gnosis-tms --features tauri/custom-protocol
      - name: Check the desktop runtime and open the release executable
        shell: pwsh
        run: |
          & ./.github/scripts/check-windows-desktop-imports.ps1
          $app = Start-Process -FilePath (Resolve-Path src-tauri/target/release/gnosis-tms.exe) -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "App closed during startup with exit code $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0 -and $i -gt 9) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'App did not open a desktop window.' }
            Write-Host "Desktop window opened and stayed alive: $($app.MainWindowTitle)"
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }
      - name: Exercise the returning project on Windows
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib project_repo_sync
